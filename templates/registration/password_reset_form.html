{% extends 'shop/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4>Восстановление пароля</h4>
            </div>
            <div class="card-body">
                {% if message %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endif %}
                
                <p class="text-muted small mb-4">Введите email, который вы указывали при регистрации. Мы отправим на него ссылку для сброса пароля.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Отправить</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <small><a href="{% url 'login' %}">Вернуться к входу</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
